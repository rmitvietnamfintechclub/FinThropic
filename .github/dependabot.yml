# Keeps dependencies and GitHub Actions current with small weekly pull requests.
# Security alerts are separate: turn on "Dependabot alerts" in the repository settings.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/web"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: "pip"
    directory: "/ingest"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "chore(ci)" }
    # Also keeps the pinned commit SHAs in .github/workflows current.
