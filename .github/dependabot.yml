# Keeps dependencies and GitHub Actions current with small weekly pull requests.
# Security alerts are separate: turn on "Dependabot alerts" in the repository settings.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/web"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    ignore:
      # @types/node follows the Node major we run (22, see .node-version), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # react and react-dom must have the exact same version, or the app and tests fail.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # next and its lint config are released together.
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      # Everything else that is not a major update: one pull request a week.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/ingest"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message: { prefix: "chore(ci)" }
    # Also keeps the pinned commit SHAs in .github/workflows current.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
